name: Preview (GitHub Pages)

# Publishes design/preview as the site root: <site>/app.html (interactive), <site>/index.html (gallery).
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Note: the "github-pages" environment may only allow the default branch; merge to main or
# add this branch under Settings > Environments > github-pages > Deployment branches.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["design/preview/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design/preview
      - id: deployment
        uses: actions/deploy-pages@v4
